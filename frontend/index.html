<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports HistoryX</title>
<style>
:root{--bg:#07162b;--panel:#0d2342;--line:#1b3556;--ink:#eef3f9;--mute:#92a6c0;--gold:#e3b04b;--sky:#4aa8ff}
@property --ang{syntax:"<angle>";initial-value:0deg;inherits:false}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI","Noto Sans Bengali","Noto Sans Devanagari",system-ui,-apple-system,sans-serif;line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:0;opacity:.13;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 600' fill='none' stroke='%23fff' stroke-width='2.5'><ellipse cx='400' cy='330' rx='360' ry='210'/><ellipse cx='400' cy='330' rx='240' ry='130'/><rect x='385' y='250' width='30' height='160' rx='4'/><circle cx='650' cy='115' r='46'/><path d='M610 95q40 30 80 0M610 135q40-30 80 0'/><circle cx='150' cy='110' r='46'/><path d='M150 64v92M104 110h92M117 77l66 66M183 77l-66 66'/></svg>") center/cover no-repeat}
.bg::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 60% 50%,transparent 20%,var(--bg) 80%)}
header{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;height:64px;padding:env(safe-area-inset-top) 28px 0;border-bottom:1px solid var(--line);background:rgba(7,22,43,.85);backdrop-filter:blur(6px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.05rem;letter-spacing:.2px}
.brand::before{content:"";width:10px;height:22px;border-radius:2px;background:var(--gold)}
select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font:inherit;font-size:.88rem;cursor:pointer}
select:focus-visible,.nav button:focus-visible,.box button:focus-visible{outline:2px solid var(--sky);outline-offset:3px}
main{position:relative;z-index:1;display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 64px - 56px);align-items:center}
.nav{display:flex;flex-direction:column;gap:28px;padding-left:28px}
.nav button{position:relative;isolation:isolate;border:0;border-radius:10px;padding:17px 28px;background:var(--panel);color:var(--ink);font-family:inherit;font-weight:600;font-size:1rem;letter-spacing:.3px;text-align:left;cursor:pointer;transition:transform .15s}
.nav button:hover{transform:translateX(3px)}
.nav button::before,.nav button::after{content:"";position:absolute;inset:-2px;border-radius:12px;z-index:-2;background:conic-gradient(from var(--ang),var(--gold),transparent 25%,var(--sky) 50%,transparent 75%,var(--gold));animation:spin 3.2s linear infinite}
.nav button::after{z-index:-3;inset:-4px;filter:blur(16px);opacity:.85}
.nav button i{position:absolute;inset:0;border-radius:10px;background:var(--panel);z-index:-1}
@keyframes spin{to{--ang:360deg}}
.hero{position:relative;padding:30px 6vw 30px 4vw;max-width:880px}
.years{font-size:clamp(3.4rem,11vw,8rem);font-weight:800;line-height:1;letter-spacing:-2px;color:transparent;-webkit-text-stroke:1.5px var(--gold);margin-bottom:22px;font-variant-numeric:tabular-nums}
h1{font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.3;font-weight:700;margin-bottom:16px;letter-spacing:-.3px}
.sub{font-size:clamp(1rem,1.8vw,1.12rem);color:var(--mute);max-width:58ch;margin-bottom:24px}
.motto{border-left:2px solid var(--gold);padding-left:16px;color:var(--ink);max-width:52ch;font-size:1.02rem}
footer{position:relative;z-index:1;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-top:1px solid var(--line);color:var(--mute);font-size:.82rem}
footer .updated{display:flex;align-items:center;gap:6px}
footer .updated::before{content:"";width:7px;height:7px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(3,10,20,.78);padding:20px;backdrop-filter:blur(4px)}
.modal.on{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px;width:min(400px,100%);text-align:center;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.box h2{font-size:1.15rem;font-weight:600;margin-bottom:22px}
.row{display:flex;gap:12px}
.row button{flex:1;padding:15px;border-radius:8px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-family:inherit;font-weight:600;font-size:1rem;cursor:pointer;transition:background .15s,color .15s,transform .1s}
.row button:hover{background:var(--gold);color:#1a1405}
.row button:active{transform:scale(.97)}
.close{margin-top:20px;background:none;border:0;color:var(--mute);font:inherit;font-size:.9rem;cursor:pointer}
.close:hover{color:var(--ink)}
.overlay{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding:24px}
.searchWrap{max-width:820px;margin:0 auto}
.searchHead{display:flex;align-items:center;gap:16px;margin-bottom:20px}
.searchHead h2{font-size:1.2rem;font-weight:600}
.backBtn{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer;font-size:.9rem}
.backBtn:hover{border-color:var(--gold);color:var(--gold)}
.searchBar{display:flex;gap:10px;margin-bottom:24px}
.searchBar input{flex:1;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit;font-size:1rem}
.searchBar input:focus{outline:2px solid var(--sky);border-color:transparent}
.searchBar button{padding:14px 22px;border:0;border-radius:8px;background:var(--gold);color:#1a1405;font:inherit;font-weight:700;cursor:pointer}
.searchBar button:hover{background:#f0c05e}
.hint{color:var(--mute);font-size:.9rem;margin:12px 0}
.catRow{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .1s}
.catRow:hover{border-color:var(--gold);transform:translateX(3px)}
.catRow span:first-child{font-weight:600;font-size:1.05rem}
.badge{color:var(--gold);font-size:.85rem}
.catTitle{margin:16px 0 6px;font-size:1.1rem;font-weight:600}
.catTitle .small{color:var(--mute);font-weight:400;font-size:.85rem}
.matchCard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-bottom:10px;cursor:pointer;transition:border-color .15s,transform .1s}
.matchCard:hover{border-color:var(--gold);transform:translateX(3px)}
.mcTop{display:flex;justify-content:space-between;font-size:.75rem;color:var(--gold);margin-bottom:6px}
.mcDate{color:var(--mute)}
.mcTeams{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:1rem}
.vs{color:var(--mute);font-weight:400;font-size:.85rem;margin:0 10px}
.mcVenue{color:var(--mute);font-size:.8rem;margin-top:6px}
.matchDetail{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:20px;margin-top:14px}
.mdTop{display:flex;justify-content:space-between;font-size:.8rem;color:var(--gold);margin-bottom:14px}
.mdRow{margin-bottom:8px;font-size:.95rem}
.mdRow b{color:var(--mute);font-weight:500;margin-right:6px}
.detailBlock{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.detailBlock h4{color:var(--gold);font-size:.85rem;margin:10px 0 4px;font-weight:600}
.detailBlock p{font-size:.9rem;color:var(--ink)}
@media(max-width:760px){
 header{padding:env(safe-area-inset-top) 18px 0}
 main{grid-template-columns:1fr;align-content:center;gap:6px}
 .nav{flex-direction:row;padding:28px 20px 0;gap:22px}
 .nav button{padding:14px 22px;font-size:.95rem}
 .hero{padding:20px 20px 36px}
 footer{padding:12px 18px;flex-direction:column;height:auto;gap:4px}
}
@media(prefers-reduced-motion:reduce){.nav button::before,.nav button::after{animation:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header>
  <div class="brand" data-i18n="brand">Sports HistoryX</div>
  <select id="lang" aria-label="Language">
    <option value="bn">বাংলা</option>
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="es">Español</option>
  </select>
</header>

<main>
  <nav class="nav">
    <button type="button" data-sport="cricket"><i></i><span data-i18n="cricket">ক্রিকেট</span></button>
    <button type="button" data-sport="football"><i></i><span data-i18n="football">ফুটবল</span></button>
  </nav>
  <section class="hero">
    <div class="years" id="years">2000–2026</div>
    <h1 data-i18n="title">২০০০ সাল থেকে আজ পর্যন্ত, খেলার প্রতিটি অধ্যায়</h1>
    <p class="sub" data-i18n="sub">ক্রিকেট ও ফুটবলের ইতিহাস, পরিসংখ্যান আর স্মরণীয় মুহূর্ত এক জায়গায়।</p>
    <p class="motto" data-i18n="motto">হার-জিত সাময়িক, কিন্তু খেলার প্রতি ভালোবাসা চিরদিনের।</p>
  </section>
</main>

<footer>
  <span data-i18n="foot">© Sports HistoryX</span>
  <span class="updated"><span data-i18n="updated">সর্বশেষ আপডেট:</span> <span id="lastUp">—</span></span>
</footer>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <h2 id="mt"></h2>
    <div class="row">
      <button type="button" data-cat="male" data-i18n="male">পুরুষ</button>
      <button type="button" data-cat="female" data-i18n="female">মহিলা</button>
    </div>
    <button type="button" class="close" id="closeModal" data-i18n="close">বন্ধ করুন</button>
  </div>
</div>

<script>
const T={
bn:{brand:"Sports HistoryX",cricket:"ক্রিকেট",football:"ফুটবল",
 title:"২০০০ সাল থেকে আজ পর্যন্ত, খেলার প্রতিটি অধ্যায়",
 sub:"ক্রিকেট ও ফুটবলের ইতিহাস, পরিসংখ্যান আর স্মরণীয় মুহূর্ত এক জায়গায়।",
 motto:"হার-জিত সাময়িক, কিন্তু খেলার প্রতি ভালোবাসা চিরদিনের।",foot:"© Sports HistoryX",updated:"সর্বশেষ আপডেট:",
 male:"পুরুষ",female:"মহিলা",close:"বন্ধ করুন",
 pickCricket:"ক্রিকেট: বিভাগ বেছে নিন",pickFootball:"ফুটবল: বিভাগ বেছে নিন",
 searchPh:"যেমন: 2015",searchBtn:"খুঁজুন",searchHint:"একটি বছর লিখুন (যেমন 2015)",
 matches:"টি ম্যাচ",noData:"এই বছরের কোনো ডেটা নেই",back:"ফিরে যান",
 date:"তারিখ",venue:"ভেন্যু",teamA:"দল এ",teamB:"দল বি",result:"ফলাফল",
 captainA:"ক্যাপ্টেন এ",captainB:"ক্যাপ্টেন বি",
 topBat:"সেরা ব্যাটসম্যান",topBowl:"সেরা বোলার",goals:"গোলদাতা",
 matchNo:"ম্যাচ নং",clickMatch:"বিস্তারিত দেখতে ক্লিক করুন"},
en:{brand:"Sports HistoryX",cricket:"Cricket",football:"Football",
 title:"Every chapter of the game, from 2000 to today",
 sub:"The history, statistics and defining moments of cricket and football in one place.",
 motto:"Wins and losses pass. The love of the game does not.",foot:"© Sports HistoryX",updated:"Last updated:",
 male:"Men",female:"Women",close:"Close",
 pickCricket:"Cricket: choose a category",pickFootball:"Football: choose a category",
 searchPh:"e.g. 2015",searchBtn:"Search",searchHint:"Enter a year (e.g. 2015)",
 matches:"matches",noData:"No data for this year",back:"Back",
 date:"Date",venue:"Venue",teamA:"Team A",teamB:"Team B",result:"Result",
 captainA:"Captain A",captainB:"Captain B",
 topBat:"Top Batsman",topBowl:"Top Bowler",goals:"Goal Scorers",
 matchNo:"Match",clickMatch:"Click a match for details"},
hi:{brand:"Sports HistoryX",cricket:"क्रिकेट",football:"फुटबॉल",
 title:"साल 2000 से आज तक, खेल का हर अध्याय",
 sub:"क्रिकेट और फुटबॉल का इतिहास, आँकड़े और यादगार पल एक ही जगह।",
 motto:"हार-जीत आती-जाती है, खेल के प्रति प्यार हमेशा रहता है।",foot:"© Sports HistoryX",updated:"अंतिम अपडेट:",
 male:"पुरुष",female:"महिला",close:"बंद करें",
 pickCricket:"क्रिकेट: श्रेणी चुनें",pickFootball:"फुटबॉल: श्रेणी चुनें",
 searchPh:"जैसे: 2015",searchBtn:"खोजें",searchHint:"एक साल लिखें (जैसे 2015)",
 matches:"मैच",noData:"इस साल का डेटा नहीं है",back:"वापस",
 date:"तारीख",venue:"स्थान",teamA:"टीम ए",teamB:"टीम बी",result:"नतीजा",
 captainA:"कप्तान ए",captainB:"कप्तान बी",
 topBat:"टॉप बल्लेबाज",topBowl:"टॉप गेंदबाज",goals:"गोल स्कोरर",
 matchNo:"मैच",clickMatch:"विवरण के लिए क्लिक करें"},
es:{brand:"Sports HistoryX",cricket:"Críquet",football:"Fútbol",
 title:"Cada capítulo del juego, del año 2000 a hoy",
 sub:"La historia, las estadísticas y los momentos clave del críquet y el fútbol en un solo lugar.",
 motto:"Las victorias y las derrotas pasan. El amor por el juego, no.",foot:"© Sports HistoryX",updated:"Última actualización:",
 male:"Hombres",female:"Mujeres",close:"Cerrar",
 pickCricket:"Críquet: elige categoría",pickFootball:"Fútbol: elige categoría",
 searchPh:"ej: 2015",searchBtn:"Buscar",searchHint:"Introduce un año (ej: 2015)",
 matches:"partidos",noData:"Sin datos para este año",back:"Volver",
 date:"Fecha",venue:"Sede",teamA:"Equipo A",teamB:"Equipo B",result:"Resultado",
 captainA:"Capitán A",captainB:"Capitán B",
 topBat:"Mejor Bateador",topBowl:"Mejor Lanzador",goals:"Goleadores",
 matchNo:"Partido",clickMatch:"Clic para detalles"}
};
const $=id=>document.getElementById(id);
const sel=$("lang"),modal=$("modal"),mt=$("mt");
let lang="bn",sport=null,gender=null,currentYear=null,currentCategories=[],currentMatches=[],lastCatIdx=0;

$("years").textContent="2000–"+new Date().getFullYear();

function apply(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-i18n]").forEach(e=>{
    const v=T[l][e.dataset.i18n]; if(v) e.textContent=v;
  });
  if(sport) mt.textContent = sport==="cricket" ? T[l].pickCricket : T[l].pickFootball;
  try{localStorage.setItem("lang",l)}catch(e){}
}
sel.addEventListener("change",()=>apply(sel.value));

document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>{
  sport=b.dataset.sport; gender=null;
  mt.textContent = sport==="cricket" ? T[lang].pickCricket : T[lang].pickFootball;
  modal.classList.add("on");
  modal.querySelector("[data-cat]").focus();
}));
function closeModal(){ modal.classList.remove("on"); }
$("closeModal").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

modal.querySelectorAll("[data-cat]").forEach(b=>b.addEventListener("click",()=>{
  gender = b.dataset.cat;
  closeModal();
  openSearch();
}));

function openSearch(){
  const t = T[lang];
  const title = (sport==="cricket"?t.cricket:t.football) + " — " + (gender==="male"?t.male:t.female);
  const ov = document.createElement("div");
  ov.id="searchOverlay"; ov.className="overlay";
  ov.innerHTML = `
    <div class="searchWrap">
      <div class="searchHead">
        <button class="backBtn" onclick="closeSearch()">← ${t.back}</button>
        <h2>${title}</h2>
      </div>
      <div class="searchBar">
        <input id="q" type="text" placeholder="${t.searchPh}" autofocus>
        <button onclick="doSearch()">${t.searchBtn}</button>
      </div>
      <div id="result"></div>
    </div>`;
  document.body.appendChild(ov);
  $("q").addEventListener("keydown",e=>{ if(e.key==="Enter") doSearch(); });
}
function closeSearch(){
  const o=$("searchOverlay"); if(o) o.remove();
  currentYear=null; currentCategories=[]; currentMatches=[];
}

async function doSearch(){
  const q = $("q").value.trim();
  const t = T[lang];
  const res = $("result");
  if(!q){ res.innerHTML = `<p class="hint">${t.searchHint}</p>`; return; }
  const year = parseInt(q);
  if(isNaN(year)){ res.innerHTML = `<p class="hint">${t.noData}</p>`; return; }
  currentYear = year;
  res.innerHTML = `<p class="hint">...</p>`;
  try{
    const r = await fetch(`/api/${sport}/${gender}/${year}`);
    const d = await r.json();
    if(!d.categories || d.categories.length===0){
      res.innerHTML = `<p class="hint">${t.noData}</p>`; return;
    }
    currentCategories = d.categories;
    renderCategories();
  }catch(e){
    res.innerHTML = `<p class="hint">Error: ${e.message}</p>`;
  }
}

function renderCategories(){
  const t=T[lang], res=$("result");
  let h = `<p class="hint">${currentCategories.length} ${t.matches} — ${currentYear}</p>`;
  currentCategories.forEach((c,i)=>{
    h += `<div class="catRow" onclick="openCategory(${i})">
      <span>${c.name}</span>
      <span class="badge">${c.count} ${t.matches} ›</span>
    </div>`;
  });
  res.innerHTML = h;
  const o=$("searchOverlay"); if(o) o.scrollTop=0;
}

async function openCategory(idx){
  const t=T[lang], cat=currentCategories[idx];
  lastCatIdx = idx;
  const res=$("result");
  res.innerHTML = `<p class="hint">...</p>`;
  try{
    const r = await fetch(`/api/${sport}/${gender}/${currentYear}/${encodeURIComponent(cat.name)}`);
    const d = await r.json();
    currentMatches = d.matches || [];
    let h = `<button class="backBtn" onclick="renderCategories()">← ${t.back}</button>
      <h3 class="catTitle">${cat.name} — ${currentYear} <span class="small">(${currentMatches.length} ${t.matches})</span></h3>
      <p class="hint">${t.clickMatch}</p>`;
    currentMatches.forEach((m,i)=>{
      h += `<div class="matchCard" onclick="openMatch(${i})">
        <div class="mcTop"><span class="mcNo">${t.matchNo} ${i+1}</span><span class="mcDate">${m.date}</span></div>
        <div class="mcTeams"><span>${m.team1}</span><span class="vs">vs</span><span>${m.team2}</span></div>
        <div class="mcVenue">${m.venue}</div>
      </div>`;
    });
    res.innerHTML = h;
    const o=$("searchOverlay"); if(o) o.scrollTop=0;
  }catch(e){ res.innerHTML=`<p class="hint">Error: ${e.message}</p>`; }
}

function openMatch(i){
  const t=T[lang], m=currentMatches[i];
  const res=$("result");
  let extra='';
  if(sport==="cricket"){
    extra = `
      <div class="detailBlock">
        <h4>${t.topBat}</h4><p>🏏 ${m.topBat} — ${m.runs} runs (${m.balls} balls)</p>
        <h4>${t.topBowl}</h4><p>🎯 ${m.topBowl} — ${m.wickets} wickets (${m.overs} overs)</p>
      </div>`;
  } else {
    extra = `<div class="detailBlock"><h4>${t.goals}</h4>${
      (m.goals||[]).map(g=>`<p>⚽ ${g.player} — ${g.minute}'</p>`).join('')
    }</div>`;
  }
  res.innerHTML = `
    <button class="backBtn" onclick="openCategory(${lastCatIdx})">← ${t.back}</button>
    <div class="matchDetail">
      <div class="mdTop"><span class="mcNo">${t.matchNo} ${i+1}</span><span class="mcDate">${m.date}</span></div>
      <div class="mdRow"><b>${t.venue}:</b> ${m.venue}</div>
      <div class="mdRow"><b>${t.teamA}:</b> ${m.team1}</div>
      <div class="mdRow"><b>${t.captainA}:</b> ${m.captain1||'—'}</div>
      <div class="mdRow"><b>${t.teamB}:</b> ${m.team2}</div>
      <div class="mdRow"><b>${t.captainB}:</b> ${m.captain2||'—'}</div>
      <div class="mdRow"><b>${t.result}:</b> ${m.result}</div>
      ${extra}
    </div>`;
  const o=$("searchOverlay"); if(o) o.scrollTop=0;
}

fetch("/api/last-updated").then(r=>r.json()).then(d=>{ $("lastUp").textContent=d.date||"—"; }).catch(()=>{});

try{const s=localStorage.getItem("lang");if(s&&T[s]){sel.value=s;apply(s)}else{apply("bn")}}catch(e){apply("bn")}
</script>
